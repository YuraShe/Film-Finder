<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Finder AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">🎬 Movie Finder AI</h5>
                    <button class="btn btn-sm btn-outline-light" onclick="resetChat()">Очистити чат</button>
                </div>
                
                <div class="card-body chat-box d-flex flex-column" id="chat-box">
                    </div>

                <div class="card-footer bg-white">
                    <div class="input-group">
                        <input type="text" id="user-input" class="form-control" placeholder="Опиши фільм..." onkeypress="handleKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendMessage()">Надіслати</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
