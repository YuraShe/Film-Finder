<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Finder AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="brand-logo">🎬</div>
                    <div>
                        <div class="brand-title">Movie Finder AI</div>
                        <div class="brand-subtitle">LM Studio chat</div>
                    </div>
                </div>

                <button id="new-chat-btn" class="primary-btn">
                    + Новий чат
                </button>
            </div>

            <div class="sidebar-label">Мої чати</div>
            <div id="chat-list" class="chat-list"></div>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 id="chat-title">Новий чат</h1>
                    <p id="chat-subtitle">
                        Опиши сцену, героя, атмосферу, приблизний рік або акторів
                    </p>
                </div>

                <div class="topbar-actions">
                    <button id="rename-chat-btn" class="ghost-btn">Перейменувати</button>
                    <button id="delete-chat-btn" class="ghost-btn danger">Видалити</button>
                </div>
            </header>

            <section id="messages" class="messages"></section>

            <section id="extra-panel" class="extra-panel hidden"></section>

            <form id="chat-form" class="composer">
                <textarea
                    id="user-input"
                    class="composer-input"
                    rows="1"
                    placeholder="Наприклад: пам’ятаю фільм, де хлопчик знаходить дивну істоту в лісі..."
                ></textarea>

                <div class="composer-footer">
                    <div class="composer-hint">
                        Enter — надіслати, Shift+Enter — новий рядок
                    </div>
                    <button id="send-btn" type="submit" class="primary-btn">
                        Надіслати
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
