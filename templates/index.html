<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Finder AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

<div class="container-fluid h-100 py-3">
    <div class="row h-100 justify-content-center">
        
        <div class="col-md-3 col-lg-3 d-flex flex-column mb-3">
            <div class="card shadow-sm h-100 border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <button class="btn btn-primary w-100 fw-bold" onclick="createNewChat()">
                        ➕ Новий чат
                    </button>
                </div>
                <div class="card-body overflow-auto p-2" id="chat-list">
                    </div>
            </div>
        </div>

        <div class="col-md-9 col-lg-7 d-flex flex-column">
            <div class="card chat-card shadow-lg border-0 h-100 d-flex flex-column">
                
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 fw-bold" id="current-chat-title">🍿 Оберіть або створіть чат</h5>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="deleteCurrentChat()">
                        🗑 Видалити чат
                    </button>
                </div>
                
                <div class="card-body chat-box d-flex flex-column flex-grow-1" id="chat-box">
                    </div>

                <div class="card-footer bg-white p-3 border-top-0">
    <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden">
        <input type="text" id="user-input" class="form-control border-0 px-4 bg-light" placeholder="Напишіть повідомлення..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="btn btn-primary px-4 fw-bold" id="send-btn" onclick="sendMessage()">
            Надіслати
        </button>
    </div>
</div>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
